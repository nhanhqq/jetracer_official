camera:
  width: 224
  height: 224
  capture_fps: 60

models:
  # Best lane model engine. The cube engine belongs to the removed obstacle
  # branch and must not be selected by the lane-following runtime.
  semantic: artifacts/track_yolo26n_sem_nano_fp16.engine
  imgsz: 224
  confidence: 0.35
  device: "0"
  lane_only: true

semantic_classes:
  background: 0
  road: 1
  divider: 2
  forbidden: 3

tracking:
  target_mode: divider       # keep camera centre on the physical divider
  lookahead_ratio: 0.8   # compensate control latency at high speed
  bottom_ratio: 0.93
  roi_top_ratio: 0.45
  min_mask_pixels: 35
  max_target_jump: 48.0  # reject spikes without delaying genuine sharp turns
  confidence_ema: 0.35
  max_lost_frames: 3
  vehicle_half_width: 13
  road_hint_min_ratio: 0.005
  front_roi_top_ratio: 0.62
  front_roi_left_ratio: 0.30
  front_roi_right_ratio: 0.70

control:
  # GIỮ NGUYÊN steering/PID như cũ
  steering_gain: -0.65
  steering_offset: 0.0
  steering_left_scale: 1.00
  steering_right_scale: 0.68
  max_steering_left: 1.00
  max_steering_right: 0.68

  kp: 0.76                    # 0.80 -> 0.76
  ki: 0.01
  kd: 0.15                    # 0.14 -> 0.15

  heading_gain: 0.36

  max_steering: 1.00
  max_steering_step: 0.10
  maneuver_steering_step: 0.14
  steering_target_alpha: 0.45
  steering_direction_deadband: 0.08
  steering_reversal_confirm_frames: 3
  steering_reversal_force: 0.55

  # CHỈ CHỈNH NHẸ THROTTLE
  throttle_gain: 1.0

  throttle_min: 0.25
  throttle_cruise: 0.72      # tăng nhẹ tốc độ nền
  throttle_max: 1.00
  throttle_always_max: true

  throttle_limit_min: 0.10
  throttle_limit_max: 1.00

  # cũ: 0.25 / 0.35
  # giảm nhẹ để hết "drop" giật cục
  throttle_step_up: 0.08
  throttle_step_down: 0.020

  maneuver_throttle_step_up: 0.10
  maneuver_throttle_step_down: 0.050

  # Smooth the speed demand so one noisy segmentation/PID frame cannot unload
  # the motor and create a throttle drop/judder.
  throttle_target_alpha: 0.25

  # cũ 0.50 -> chỉ giảm nhẹ
  curve_slowdown: 0.30

  # cũ 0.70 -> tránh hụt ga mạnh khi cua phải
  right_turn_throttle_scale: 0.88

  # GIỮ vùng boost gần config cũ để behavior không đổi nhiều
  straight_boost_start: 0.35
  straight_boost_end: 0.55

  low_confidence_slowdown: 0.65

  emergency_obstacle_ratio: 1.00
  obstacle_slow_ratio: 0.75
  avoidance_speed_scale: 0.80

  reverse_neutral_time: 0.10
  reverse_time: 0.10
  reverse_throttle: 0.35

  recovery_steering: 1.00
  recovery_throttle: 0.35

  lane_reacquire_steering: 1.00
  lane_reacquire_throttle: 0.40

  avoid_retry_time: 0.00
  avoid_hold_time: 0.00

  white_correct_time: 0.00
  white_side_correct_time: 0.00
  white_recovery_cooldown: 0.00

  white_front_reverse_threshold: 1.00
  white_front_reverse_frames: 999
  white_side_threshold: 1.00
  white_side_margin: 0.00

competition:
  hsv_lower: [38, 100, 120]
  hsv_upper: [88, 255, 255]
  min_area_ratio: 0.002
  max_area_ratio: 0.20
  min_circularity: 0.82
  confirm_frames: 3
  latch_start: true

runtime:
  log_dir: logs
  log_every: 10
  display_stride: 3
  display: false
  dry_run: true
