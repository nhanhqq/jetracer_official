camera:
  width: 224
  height: 224
  capture_fps: 60

models:
  semantic: artifacts/track_yolo26n_sem_cube_nano_fp16.engine
  imgsz: 224
  confidence: 0.35
  device: "0"

semantic_classes:
  background: 0
  road: 1
  divider: 2
  forbidden: 3
  obstacle: 4

tracking:
  target_mode: divider       # keep camera centre on the physical divider
  lookahead_ratio: 0.60
  bottom_ratio: 0.93
  roi_top_ratio: 0.45
  min_mask_pixels: 35
  confidence_ema: 0.35
  max_lost_frames: 3
  lane_lock_confirm_frames: 3
  lane_lock_min_confidence: 0.55
  vehicle_half_width: 13
  road_hint_min_ratio: 0.005
  front_roi_top_ratio: 0.62
  front_roi_left_ratio: 0.30
  front_roi_right_ratio: 0.70
  obstacle_confirm_frames: 2

control:
  steering_gain: -0.65       # hardware calibration, inherited from notebook3
  steering_offset: 0.0
  throttle_gain: 1.0         # 100% full motor power output
  kp: 0.92
  ki: 0.02
  kd: 0.10
  heading_gain: 0.42
  max_steering: 1.00         # Maximum steering lock (100% full wheel turn)
  # Steering rate limit set to instant full response
  max_steering_step: 1.00    # Instantaneous wheel turn to max lock without lag
  maneuver_steering_step: 1.00
  maneuver_throttle_step_up: 1.00
  maneuver_throttle_step_down: 1.00
  steering_target_alpha: 1.00 # 0 delay filtering on steering target
  throttle_min: 1.00         # Keep maximum 100% throttle in all corners and maneuvers
  throttle_cruise: 1.00      # 100% cruise throttle
  throttle_max: 1.00         # 100% max throttle
  throttle_limit_min: 0.10
  throttle_limit_max: 1.00
  throttle_step_up: 1.00     # Instant throttle response to 100%
  throttle_step_down: 1.00
  curve_slowdown: 0.00       # 0% slowdown on curves (no reduction in corners)
  straight_boost_start: 0.10
  straight_boost_end: 0.30
  low_confidence_slowdown: 1.00 # No slowdown even if confidence drops
  emergency_obstacle_ratio: 0.78
  obstacle_slow_ratio: 0.58
  avoidance_speed_scale: 1.00 # 100% full speed during obstacle avoidance
  # ESC needs a neutral command before changing from forward to reverse.
  reverse_neutral_time: 0.12
  reverse_time: 0.35
  reverse_throttle: 0.20
  recovery_steering: 1.00    # 100% max steering lock on recovery
  recovery_throttle: 1.00    # 100% full throttle on recovery
  lane_reacquire_steering: 1.00 # 100% max steering lock on reacquire
  lane_reacquire_throttle: 1.00 # 100% full throttle on reacquire
  obstacle_avoid_time: 2.0
  obstacle_avoid_max_time: 4.0
  obstacle_avoid_throttle: 1.00 # 100% full throttle during avoidance
  obstacle_avoid_steering: 1.00 # 100% full steering lock during avoidance
  obstacle_preempt_steering_step: 1.00
  obstacle_avoid_steering_limit: 1.00
  avoid_retry_time: 0.25
  avoid_hold_time: 0.45
  white_correct_time: 0.30
  white_side_correct_time: 0.22
  white_recovery_cooldown: 0.40
  white_front_reverse_threshold: 0.58
  white_front_reverse_frames: 2
  white_side_threshold: 0.12
  white_side_margin: 0.04

competition:
  hsv_lower: [38, 100, 120]
  hsv_upper: [88, 255, 255]
  min_area_ratio: 0.002
  max_area_ratio: 0.20
  min_circularity: 0.82
  confirm_frames: 3
  latch_start: true

runtime:
  log_dir: logs
  log_every: 10
  display_stride: 3
  display: false
  dry_run: true
