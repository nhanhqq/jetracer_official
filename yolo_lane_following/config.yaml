camera:
  width: 224
  height: 224
  capture_fps: 60

models:
  # Best lane model engine. The cube engine belongs to the removed obstacle
  # branch and must not be selected by the lane-following runtime.
  semantic: artifacts/track_yolo26n_sem_nano_fp16.engine
  imgsz: 224
  confidence: 0.35
  device: "0"
  lane_only: true

semantic_classes:
  background: 0
  road: 1
  divider: 2
  forbidden: 3

tracking:
  target_mode: divider       # keep camera centre on the physical divider
  # Look farther ahead for the straight -> 90-degree-left transition. This is
  # still inside the stable fitted-divider ROI and gives time to brake/turn.
  lookahead_ratio: 0.62
  bottom_ratio: 0.93
  roi_top_ratio: 0.45
  min_mask_pixels: 35
  max_target_jump: 22.0  # gate spikes; dashed-divider chaining handles real turns
  path_alpha: 0.60
  path_beta: 0.10
  path_prediction_time: 0.035  # compensate a small portion of inference latency
  confidence_ema: 0.35
  max_lost_frames: 3
  vehicle_half_width: 13
  road_hint_min_ratio: 0.005
  front_roi_top_ratio: 0.62
  front_roi_left_ratio: 0.30
  front_roi_right_ratio: 0.70

control:
  # Conservative closed-loop steering: derivative and target filtering remove
  # frame-to-frame zigzag while the slew limit prevents snap steering.
  steering_gain: -0.65
  steering_offset: 0.0
  steering_left_scale: 1.00
  steering_right_scale: 0.68
  max_steering_left: 0.90
  max_steering_right: 0.62

  kp: 0.56
  ki: 0.00
  kd: 0.035
  derivative_alpha: 0.20

  heading_gain: 0.30

  max_steering: 1.00
  # All live slew/reversal values are wall-clock based, so a Nano FPS dip does
  # not silently make the vehicle slower to react or change its damping.
  steering_rate: 1.60
  steering_maneuver_rate: 2.20
  max_steering_step: 0.08
  maneuver_steering_step: 0.10
  steering_target_alpha: 0.30
  steering_direction_deadband: 0.08
  steering_reversal_confirm_time: 0.06
  steering_reversal_force: 0.60

  throttle_gain: 1.0

  # Keep enough motor torque to avoid cogging/stall, while leaving a real gap
  # below straight-line maximum speed.
  throttle_min: 0.44  # legacy/fixed manoeuvre fallback; not a corner speed floor
  throttle_motion_min: 0.44
  # Requested for vehicle test: allow the straight-line scheduler to reach the
  # hardware-normalised maximum. Curve/corner and right-turn limits remain.
  throttle_cruise: 1.00
  throttle_max: 1.00
  # Maximum speed is only reached on a stable straight. Never bypass the
  # curve/confidence/right-turn safety scheduler.
  throttle_always_max: false

  throttle_limit_min: 0.20
  throttle_limit_max: 1.00

  throttle_step_up: 0.045
  throttle_step_down: 0.045
  throttle_accel_rate: 0.60
  throttle_brake_rate: 1.50

  maneuver_throttle_step_up: 0.10
  maneuver_throttle_step_down: 0.050

  # Smooth the speed demand so one noisy segmentation/PID frame cannot unload
  # the motor and create a throttle drop/judder.
  throttle_target_brake_alpha: 0.60
  throttle_target_accel_alpha: 0.18

  curve_slowdown: 0.58
  curve_curve_load: 0.40
  corner_curve_load: 0.62
  curve_throttle: 0.48
  corner_throttle: 0.00
  curve_load_attack_alpha: 0.80
  curve_load_release_alpha: 0.15

  right_turn_throttle_scale: 0.70

  straight_boost_start: 0.10
  straight_boost_end: 0.34

  low_confidence_slowdown: 0.58
  confidence_full_speed: 0.75
  lane_dropout_throttle_scale: 0.65

  emergency_obstacle_ratio: 1.00
  obstacle_slow_ratio: 0.75
  avoidance_speed_scale: 0.80

  reverse_neutral_time: 0.10
  reverse_time: 0.10
  reverse_throttle: 0.35

  recovery_steering: 0.65
  recovery_throttle: 0.42

  lane_reacquire_steering: 0.60
  lane_reacquire_throttle: 0.40

  avoid_retry_time: 0.00
  avoid_hold_time: 0.00

  white_correct_time: 0.00
  white_side_correct_time: 0.00
  white_recovery_cooldown: 0.00

  white_front_reverse_threshold: 1.00
  white_front_reverse_frames: 999
  white_side_threshold: 1.00
  white_side_margin: 0.00

competition:
  hsv_lower: [38, 100, 120]
  hsv_upper: [88, 255, 255]
  min_area_ratio: 0.002
  max_area_ratio: 0.20
  min_circularity: 0.82
  confirm_frames: 3
  latch_start: true

runtime:
  log_dir: logs
  log_every: 10
  display_stride: 3
  display: false
  dry_run: true
